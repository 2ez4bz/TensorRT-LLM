trust_remote_code: true
tensor_parallel_size: 1
max_batch_size: 512
max_num_tokens: 65536
max_seq_len: 10240
enable_chunked_prefill: true
encoder_max_batch_size: 8
encoder_max_num_tokens: 65536
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 24
  - 32
  - 40
  - 48
  - 56
  - 64
  - 72
  - 80
  - 88
  - 96
  - 104
  - 112
  - 120
  - 128
  - 160
  - 192
  - 224
  - 256
  - 288
  - 320
  - 352
  - 384
  - 416
  - 448
  - 480
  - 512
moe_config:
  backend: CUTEDSL
kv_cache_config:
  free_gpu_memory_fraction: 0.9
  mamba_ssm_cache_dtype: bfloat16
  enable_block_reuse: false
  dtype: fp8
  avg_seq_len: 9216
speculative_config:
  decoding_type: MTP
  max_draft_len: 3
  moe_backend: TRTLLM
sparse_attention_config:
  algorithm: qsa
  index_share_for_mtp_iteration: true
num_postprocess_workers: 4
num_serve_frontends: 8
stream_interval: 4
print_iter_log: true
modeling_v2: require
